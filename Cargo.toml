[package]
name = "bench-report"
version = "0.1.0"
authors = ["Intermountainh8ter"]
edition = "2021"
license = "MIT"
description = "Shared results-to-README renderer across the bench suite. Reads results/*.json and splices a Markdown table between sentinels in a README."
repository = "https://github.com/Intermountainh8ter/bench-report"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0.229", features = ["derive"] }

[[bin]]
name = "bench-report"
path = "src/main.rs"
